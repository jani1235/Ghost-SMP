<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GhostSMP | Whitelist</title><style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#382068,#101020 68%);color:#f7f4ff}header{padding:25px max(5vw,20px);border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900;letter-spacing:.5px}.brand span{color:#bc93ff}header a{color:#ddd1fa;text-decoration:none;font-size:14px}main{max-width:720px;margin:64px auto;padding:0 20px}h1{font-size:clamp(34px,6vw,57px);margin:0 0 12px}h1 span{color:#c39aff}.intro{color:#c5badb;font-size:17px;line-height:1.6;margin-bottom:34px}.card{background:#1c1731;border:1px solid #5b487c;border-radius:22px;padding:clamp(22px,5vw,40px);box-shadow:0 20px 65px #0005}h2{margin:0 0 8px;font-size:25px}.sub{color:#bfb2d7;margin:0 0 25px}label{display:block;margin:17px 0 7px;font-weight:650}input,textarea{width:100%;background:#120f23;border:1px solid #5b4c78;border-radius:10px;color:white;font:inherit;padding:13px 15px;outline:none}input:focus,textarea:focus{border-color:#bd8dff;box-shadow:0 0 0 3px #a776f433}textarea{min-height:130px;resize:vertical}button{width:100%;background:#a978f7;color:#140b24;border:0;border-radius:11px;font:inherit;font-weight:800;padding:15px;cursor:pointer;margin-top:24px}button:disabled{opacity:.6;cursor:wait}#msg{margin-top:16px;min-height:25px;font-weight:600}.ok{color:#91edb4}.err{color:#ffaaaa}.hidden{position:absolute;left:-10000px}footer{text-align:center;color:#a99bbf;font-size:13px;padding:40px 15px}
</style></head><body><header><div class="brand">👻 Ghost<span>SMP</span></div><a href="#aanmelden">Whitelist aanvragen</a></header><main><h1>Welkom bij <span>GhostSMP</span></h1><p class="intro">Klaar om mee te doen aan onze Minecraft-community? Vul hieronder je whitelistaanvraag in. Ons team beoordeelt je aanvraag.</p><section class="card" id="aanmelden"><h2>Whitelist aanvragen</h2><p class="sub">Vul je gegevens in om mee te doen.</p><form id="form"><label for="minecraft">Minecraft-gebruikersnaam</label><input id="minecraft" name="minecraft" maxlength="16" minlength="3" pattern="[A-Za-z0-9_]{3,16}" required autocomplete="off" placeholder="JouwMinecraftNaam"><label for="discord">Discord-gebruikersnaam</label><input id="discord" name="discord" maxlength="80" minlength="2" required autocomplete="off" placeholder="jouw.discordnaam"><label for="reason">Waarom wil je meedoen?</label><textarea id="reason" name="reason" minlength="10" maxlength="1000" required placeholder="Vertel waarom je op GhostSMP wilt spelen..."></textarea><div class="hidden" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><button type="submit" id="send">Aanvraag versturen</button><div id="msg" role="status" aria-live="polite"></div></form></section></main><footer>© GhostSMP · Minecraft-community</footer><script>
const form=document.getElementById('form'),button=document.getElementById('send'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;msg.textContent='Aanvraag versturen...';msg.className='';const data=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error||'Er is iets misgegaan.');msg.textContent='Je aanvraag is ontvangen!';msg.className='ok';form.reset()}catch(err){msg.textContent=err.message;msg.className='err'}finally{button.disabled=false}});
</script></body></html>
